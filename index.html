<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English with Paa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
  /* lesson menu: same Kiddyland colours as the lesson pages */
  :root { --ink: #3d3d3d; --soft: #6b6b6b; --pink: #ec2a7b; --blue: #29a8e0; --purple: #6a3d9a; --yellow: #ffc928; color-scheme: light; }
  body { margin: 0; min-height: 100vh; background: #fff; color: var(--ink); font-family: "Nunito", system-ui, sans-serif; }
  main { max-width: 52rem; margin: 0 auto; padding: 2.5rem 16px 3rem; }
  h1 { margin: 0 0 0.3rem; font: 700 clamp(2.2rem, 7vw, 3.6rem)/1.1 "Fredoka", sans-serif; }
  h1 span { color: var(--pink); }
  .sub { margin: 0 0 2rem; color: var(--soft); font-size: 1.1rem; }
  h2 { font: 700 1.5rem/1.2 "Fredoka", sans-serif; color: var(--purple); margin: 2rem 0 0.8rem; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.8rem; }
  a.lesson { display: flex; align-items: center; gap: 1rem; text-decoration: none; color: inherit; background: #fff;
    border-radius: 1.2rem; padding: 1rem 1.2rem; box-shadow: 0 0.6rem 1.6rem rgba(60, 40, 90, 0.14); border-left: 0.45rem solid var(--blue); }
  a.lesson:hover, a.lesson:focus-visible { border-left-color: var(--pink); outline: none; }
  .tag { flex: none; font: 700 1rem/1 "Fredoka", sans-serif; background: var(--yellow); color: var(--ink); border-radius: 999px; padding: 0.45rem 0.8rem; }
  .what b { display: block; font: 700 1.25rem/1.2 "Fredoka", sans-serif; }
  .what span { color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>English with <span>Paa</span></h1>
  <p class="sub">Bài giảng trên TV cảm ứng</p>

  <h2>Lớp Donal (3 tuổi) · Tháng 11: Food</h2>
  <ul>
    <li><a class="lesson" href="donal/tuan2-review/"><span class="tag">Tuần 2</span><span class="what"><b>Review: I like food!</b><span>TV time · Mimi's Choice · Food Shop</span></span></a></li>
  </ul>
</main>
</body>
</html>
